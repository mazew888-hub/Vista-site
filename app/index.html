<!DOCTYPE html>
<html>
<head>
  <base href="/Vista-site/app/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vista, an image-first feed reader.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vista">
  <meta name="theme-color" content="#0A0A0B">
  <meta name="color-scheme" content="dark">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Vista</title>
  <link rel="manifest" href="manifest.json">
  <!-- iPhone launch screens: plain Vista black instead of a white/grey flash. -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch-1125x2436.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch-1170x2532.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch-1179x2556.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch-1206x2622.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch-1284x2778.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch-1290x2796.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch-1320x2868.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch-1080x2340.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch-1242x2688.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/launch-828x1792.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/launch-750x1334.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/launch-640x1136.png">
  <style>
    html, body { background: #0A0A0B; margin: 0; height: 100%; }

    /* Title card: drawn by the page itself, so it shows the instant Vista
       opens, and covers the engine loading until the feed is ready. */
    /* Sized to the whole screen (100vh), not the visible area, so the logo
       doesn't jump while iOS settles the app's toolbars. */
    #vista-splash {
      position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 9999;
      background: radial-gradient(120% 80% at 50% 38%, #17171B 0%, #0A0A0B 62%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: transform .62s cubic-bezier(.7, 0, .2, 1), border-radius .62s ease;
      will-change: transform;
    }
    #vista-splash .mark {
      font-family: -apple-system, BlinkMacSystemFont, "Inter Tight", "Segoe UI", sans-serif;
      font-weight: 900; font-size: 64px; letter-spacing: -0.045em; color: #fff;
      line-height: 1; display: flex; align-items: baseline;
      opacity: 0;
      animation: vs-in .45s ease-out forwards;
      transition: transform .62s cubic-bezier(.7, 0, .2, 1), opacity .4s ease;
    }
    #vista-splash .dot {
      color: #FF7A2F; display: inline-block; margin-left: 1px;
      animation: vs-dot 1.1s ease-in-out .5s infinite;
    }
    #vista-splash .sweep {
      margin-top: 22px; width: 92px; height: 3px; border-radius: 3px;
      background: rgba(255, 255, 255, .08); overflow: hidden; position: relative;
      opacity: 0; animation: vs-fade .4s ease .35s forwards;
    }
    #vista-splash .sweep::after {
      content: ""; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 3px;
      background: linear-gradient(90deg, transparent, #FF7A2F, transparent);
      animation: vs-sweep 1.15s ease-in-out infinite;
    }
    /* Ready: the card sweeps up and away, the logo a little ahead of it. */
    #vista-splash.out { transform: translateY(-104%); border-radius: 0 0 36px 36px; }
    #vista-splash.out .mark { transform: translateY(-60px) scale(.9); opacity: 0; }

    @keyframes vs-in { to { opacity: 1; } }
    @keyframes vs-fade { to { opacity: 1; } }
    @keyframes vs-dot {
      0%, 100% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-9px) scale(1.15); }
      60% { transform: translateY(0) scale(.92); }
    }
    @keyframes vs-sweep { 0% { left: -40%; } 100% { left: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      #vista-splash .dot, #vista-splash .sweep::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="vista-splash" aria-label="Vista is loading">
    <div class="mark">vista<span class="dot">.</span></div>
    <div class="sweep"></div>
  </div>
  <script>
    // Vista calls this once the feed is on screen.
    window.vistaReady = function () {
      var el = document.getElementById('vista-splash');
      if (!el || el.classList.contains('out')) return;
      el.classList.add('out');
      setTimeout(function () { el.remove(); }, 700);
    };
    // Keep a copy of Vista on the phone so it opens without downloading.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('vista_sw.js').catch(function () {});
    }
    // Never leave the card up if something goes wrong.
    setTimeout(function () { window.vistaReady(); }, 15000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
